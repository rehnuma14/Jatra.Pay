<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JatraPay - makes your journey smooth</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background-color: #eef1f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-window {
      width: 100%;
      max-width: 920px;
      background: #f4f4f4;
      border: 1px solid #c5c9d0;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .title-bar {
      background: #2c3e50;
      color: #ffffff;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: #27ae60;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
    }

    @media (max-width: 720px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    fieldset {
      border: 1px solid #bcbcbc;
      border-radius: 4px;
      padding: 20px;
      margin: 0;
    }

    legend {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      padding: 0 6px;
    }

    .left-panel {
      background: #ffffff;
    }

    .right-panel {
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
    }

    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #222;
      margin-bottom: 6px;
      margin-top: 14px;
    }

    label.field-label:first-of-type {
      margin-top: 0;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 9px 10px;
      font-size: 14px;
      border: 1px solid #b5b5b5;
      border-radius: 4px;
      outline: none;
    }

    input:focus {
      border-color: #2c3e50;
    }

    .radio-group {
      display: flex;
      gap: 24px;
      margin-top: 6px;
      font-size: 14px;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    button.process-btn {
      width: 100%;
      margin-top: 22px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #2c3e50;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.process-btn:hover {
      background-color: #1a252f;
    }

    .history-box {
      width: 100%;
      height: 330px;
      background: #ffffff;
      border: 1px solid #ccc;
      padding: 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #222;
    }

    /* Dialog Modal (Replaces JOptionPane) */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 380px;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .modal-header {
      background: #ececec;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 14px;
      border-bottom: 1px solid #ddd;
    }

    .modal-body {
      padding: 18px 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .modal-footer {
      padding: 10px 16px;
      text-align: right;
      background: #f9f9f9;
      border-top: 1px solid #eee;
    }

    .modal-footer button {
      padding: 6px 18px;
      font-size: 13px;
      background: #2c3e50;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-window">
    <div class="title-bar">
      <span>JatraPay - makes your journey smooth</span>
      <span class="badge">Web Showcase</span>
    </div>

    <div class="main-grid">
      <!-- Left Panel -->
      <fieldset class="left-panel">
        <legend>JatraPay Transaction Details</legend>

        <label class="field-label" for="startInput">Enter Starting Location:</label>
        <input list="locations" id="startInput" placeholder="Select or type location..." />

        <label class="field-label" for="destInput">Enter Destination:</label>
        <input list="locations" id="destInput" placeholder="Select or type location..." />

        <datalist id="locations">
          <option value="GEC"></option>
          <option value="Bahaddarhat"></option>
          <option value="Muradpur"></option>
          <option value="Oxygen"></option>
          <option value="Chawkbazar"></option>
          <option value="Station Road"></option>
        </datalist>

        <label class="field-label" for="fareInput">Enter Fare Amount (1-100TK):</label>
        <input type="text" id="fareInput" placeholder="e.g. 20" />

        <label class="field-label">Payment Method:</label>
        <div class="radio-group">
          <label><input type="radio" name="paymentMethod" value="QR" checked /> QR</label>
          <label><input type="radio" name="paymentMethod" value="USSD" /> USSD</label>
        </div>

        <button class="process-btn" onclick="onProcess()">Process</button>
      </fieldset>

      <!-- Right Panel -->
      <fieldset class="right-panel">
        <legend>Transaction History</legend>
        <div class="history-box" id="historyArea"></div>
      </fieldset>
    </div>
  </div>

  <!-- JOptionPane Equivalent Modal -->
  <div class="modal-overlay" id="dialogOverlay">
    <div class="modal-box">
      <div class="modal-header" id="dialogTitle">Message</div>
      <div class="modal-body" id="dialogMessage"></div>
      <div class="modal-footer">
        <button onclick="closeDialog()">OK</button>
      </div>
    </div>
  </div>

  <script>
    // OOP Classes mirrored from JatraPay.java
    class TransportService {
      constructor(route, fare) {
        this.route = route;
        this.fare = fare;
      }
      calculateFare() { return this.fare; }
      getRouteName() { return this.route; }
      getBaseFare() { return this.fare; }
    }

    class Passenger {
      constructor(name, type) {
        this.name = name;
        this.type = type;
      }
    }

    class Payment {
      constructor(method) {
        this.method = method;
      }
      processPayment(amount) {
        return true;
      }
    }

    class TransactionController {
      processTransaction(passenger, service, payment, fareEntered) {
        payment.processPayment(fareEntered);
        return "Completed";
      }
    }

    const controller = new TransactionController();

    function showDialog(title, message) {
      document.getElementById("dialogTitle").textContent = title;
      document.getElementById("dialogMessage").textContent = message;
      document.getElementById("dialogOverlay").style.display = "flex";
    }

    function closeDialog() {
      document.getElementById("dialogOverlay").style.display = "none";
    }

    function formatDateTime() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

    function addHistory(text) {
      const historyArea = document.getElementById("historyArea");
      historyArea.textContent += text + "\n-----------------------------------\n";
      historyArea.scrollTop = historyArea.scrollHeight;
    }

    function onProcess() {
      const start = document.getElementById("startInput").value.trim();
      const dest = document.getElementById("destInput").value.trim();
      const fareText = document.getElementById("fareInput").value.trim();

      if (!start || !dest) {
        showDialog("Input Error", "Starting location and destination cannot be empty.");
        return;
      }

      if (start === dest) {
        showDialog("Input Error", "Starting location and destination cannot be the same.");
        return;
      }

      const fareValue = Number(fareText);
      if (fareText === "" || isNaN(fareValue) || fareValue < 1 || fareValue > 100) {
        showDialog("Input Error", "Enter a valid fare between 1 - 100 TK.");
        return;
      }

      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const service = new TransportService(`${start} → ${dest}`, fareValue);
      const passenger = new Passenger("Default User", "Regular");
      const payment = new Payment(paymentMethod);
      const status = controller.processTransaction(passenger, service, payment, fareValue);

      const now = formatDateTime();
      const receipt =
        `Date & Time: ${now}\n\n` +
        `From ${start} to ${dest}, payment of ${Math.round(fareValue)} taka has been completed.\n\n` +
        `Payment Method: ${paymentMethod}\n` +
        `Status: ${status}`;

      showDialog("✅ Payment Receipt", receipt);
      addHistory(receipt);

      // Reset fields just like JatraPay.java
      document.getElementById("startInput").value = "";
      document.getElementById("destInput").value = "";
      document.getElementById("fareInput").value = "";
      document.querySelector('input[name="paymentMethod"][value="QR"]').checked = true;
    }
  </script>
</body>
</html>
